<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可验证多方安全秘密共享系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #d1d5db; }
        .glassmorphism { background: rgba(31, 41, 55, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
        .btn:active { transform: scale(0.98); }
        .tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; }
        .node-highlight { border-color: #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.45); }
        .node-selected { border-color: #16a34a !important; background-color: rgba(22, 163, 74, 0.25) !important; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="p-4 lg:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl lg:text-4xl font-bold text-white">全球银行分层密钥安全管理系统</h1>
            <p class="text-lg text-gray-400 mt-2">可验证 · 可刷新 · 分层级的秘密共享交互式演示 (Python 后端驱动)</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左侧控制台 -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glassmorphism p-6">
                    <h2 class="text-xl font-semibold mb-4 text-white border-b border-gray-600 pb-2">系统控制台</h2>
                    <button id="initSystem" class="w-full py-2 px-4 rounded-lg font-semibold bg-blue-600 hover:bg-blue-700 text-white btn flex items-center justify-center transition-all">
                        <i data-lucide="power" class="w-5 h-5 mr-2"></i> 初始化银行系统
                    </button>
                    <div id="vssParams" class="mt-4 text-xs text-gray-400 space-y-1 hidden">
                        <p><strong>VSS 公共参数 (由 Python 后端生成):</strong></p>
                        <p class="break-all"><strong>P:</strong> <span id="paramP"></span></p>
                        <p class="break-all"><strong>Q:</strong> <span id="paramQ"></span></p>
                        <p class="break-all"><strong>G:</strong> <span id="paramG"></span></p>
                    </div>
                </div>

                <div id="keyOps" class="glassmorphism p-6 hidden">
                    <h2 class="text-xl font-semibold mb-4 text-white border-b border-gray-600 pb-2">密钥操作</h2>
                    <div id="keyTabs" class="flex border-b border-gray-700 mb-4">
                        <button class="tab-btn active py-2 px-4 text-sm font-medium transition-colors" data-tab="master">主密钥</button>
                        <button class="tab-btn py-2 px-4 text-sm font-medium transition-colors" data-tab="regional">区域密钥</button>
                        <button class="tab-btn py-2 px-4 text-sm font-medium transition-colors" data-tab="branch">分行密钥</button>
                    </div>
                    <div id="tabContent"></div>
                </div>

                <div id="recoveryRefreshOps" class="glassmorphism p-6 hidden">
                    <h2 class="text-xl font-semibold mb-4 text-white border-b border-gray-600 pb-2">恢复 & 刷新</h2>
                    <div class="space-y-4">
                        <select id="recoveryLevelSelect" class="w-full bg-gray-800 border border-gray-600 rounded-md px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">-- 选择要操作的密钥 --</option>
                        </select>
                        <p id="recoveryHint" class="text-center text-sm text-gray-400 h-10 flex items-center justify-center"></p>
                        <div class="flex gap-2">
                            <button id="attemptRecovery" class="w-full py-2 px-4 rounded-lg font-semibold bg-gray-600 hover:bg-gray-700 text-white btn flex items-center justify-center transition-all" disabled>
                                <i data-lucide="key-round" class="w-5 h-5 mr-2"></i> 恢复密钥
                            </button>
                            <button id="refreshShares" class="w-full py-2 px-4 rounded-lg font-semibold bg-gray-600 hover:bg-gray-700 text-white btn flex items-center justify-center transition-all" disabled>
                                <i data-lucide="refresh-cw" class="w-5 h-5 mr-2"></i> 刷新份额
                            </button>
                        </div>
                    </div>
                </div>

                <div class="glassmorphism p-6">
                    <h2 class="text-xl font-semibold mb-4 text-white border-b border-gray-600 pb-2 flex justify-between items-center">
                        <span>操作日志</span>
                        <button id="clearLogs" class="text-xs text-gray-400 hover:text-white">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </h2>
                    <div id="logs" class="max-h-96 overflow-y-auto space-y-3 pr-2"></div>
                </div>
            </div>

            <!-- 右侧组织结构图 -->
            <div class="lg:col-span-2 space-y-6">
                <div class="glassmorphism p-6 min-h-[540px]">
                    <h2 class="text-xl font-semibold mb-4 text-white border-b border-gray-600 pb-2">全球组织结构图</h2>
                    <div id="orgChart" class="relative flex flex-col items-center justify-start pt-4 gap-8"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 份额详情模态框 -->
    <div id="sharesModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50 p-4">
        <div class="glassmorphism p-6 w-full max-w-5xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-600 pb-3 mb-4">
                <h2 id="modalTitle" class="text-xl font-semibold text-white">密钥份额详情</h2>
                <button id="closeModal" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            <div class="flex-grow overflow-y-auto pr-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <div id="polynomialSection">
                        <h3 class="font-semibold text-white mb-2">秘密多项式 f(x) = Σ a<sub>j</sub>·x<sup>j</sup> (mod q)</h3>
                        <div id="modalPolynomial" class="text-xs bg-gray-900 p-3 rounded-md break-all"></div>
                    </div>
                    <div>
                        <h3 class="font-semibold text-white mb-2">公开承诺 <span class="font-mono">C<sub>j</sub> = g<sup>a<sub>j</sub></sup> mod p</span></h3>
                        <div id="modalCommitments" class="text-xs bg-gray-900 p-3 rounded-md break-all max-h-60 overflow-y-auto"></div>
                    </div>
                </div>
                <div>
                    <h3 class="font-semibold text-white mb-2">分发份额 <span class="font-mono">s<sub>i</sub> = f(i) mod q</span></h3>
                    <div id="modalShares" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

<script>
const API_BASE_URL = '/api';

try {
    lucide.createIcons();

    document.addEventListener('DOMContentLoaded', () => {
        const state = {
            systemInitialized: false,
            keys: {},
            organization: { hq: { name: '', nodes: [] }, regions: [], all_branches: [] },
            selectedShares: [],
            currentKeyId: null,
            limits: { maxSecretBytes: null },
        };

        const ui = {
            initSystem: document.getElementById('initSystem'),
            vssParams: document.getElementById('vssParams'),
            paramP: document.getElementById('paramP'),
            paramQ: document.getElementById('paramQ'),
            paramG: document.getElementById('paramG'),
            keyOps: document.getElementById('keyOps'),
            recoveryRefreshOps: document.getElementById('recoveryRefreshOps'),
            keyTabs: document.getElementById('keyTabs'),
            orgChart: document.getElementById('orgChart'),
            logs: document.getElementById('logs'),
            sharesModal: document.getElementById('sharesModal'),
            modalTitle: document.getElementById('modalTitle'),
            modalPolynomial: document.getElementById('modalPolynomial'),
            polynomialSection: document.getElementById('polynomialSection'),
            modalCommitments: document.getElementById('modalCommitments'),
            modalShares: document.getElementById('modalShares'),
            closeModal: document.getElementById('closeModal'),
            tabContent: document.getElementById('tabContent'),
            recoveryLevelSelect: document.getElementById('recoveryLevelSelect'),
            recoveryHint: document.getElementById('recoveryHint'),
            attemptRecovery: document.getElementById('attemptRecovery'),
            refreshShares: document.getElementById('refreshShares'),
            clearLogs: document.getElementById('clearLogs'),
        };

        const textEncoder = new TextEncoder();
        const spinnerHtml = '<div class="spinner w-5 h-5 border-t-2 border-white rounded-full mx-auto"></div>';

        const api = {
            async post(endpoint, body) {
                const activeElement = document.activeElement;
                const button = activeElement && typeof activeElement.closest === 'function'
                    ? activeElement.closest('button')
                    : null;
                let originalContent;
                if (button) {
                    originalContent = button.innerHTML;
                    button.innerHTML = spinnerHtml;
                    button.disabled = true;
                }
                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const rawText = await response.text();
                    let payload = {};
                    if (rawText) {
                        try {
                            payload = JSON.parse(rawText);
                        } catch {
                            payload = { message: rawText };
                        }
                    }
                    if (!response.ok) {
                        const message = typeof payload === 'object' && payload !== null && payload.message
                            ? payload.message
                            : `HTTP ${response.status}`;
                        throw new Error(message);
                    }
                    return payload;
                } finally {
                    if (button) {
                        button.innerHTML = originalContent;
                        button.disabled = false;
                    }
                }
            },
        };

        function log(type, title, message) {
            const iconMap = {
                success: { icon: 'check-circle-2', color: 'text-green-400' },
                info: { icon: 'info', color: 'text-blue-400' },
                error: { icon: 'alert-triangle', color: 'text-red-400' },
                action: { icon: 'zap', color: 'text-yellow-400' },
            };
            const entry = iconMap[type] || iconMap.info;
            const safeMessage = String(message ?? '').replace(/\n/g, '<br>');
            const logHTML = `
                <div class="glassmorphism p-3 rounded-lg flex items-start gap-3">
                    <i data-lucide="${entry.icon}" class="${entry.color} w-5 h-5 mt-1 flex-shrink-0"></i>
                    <div>
                        <p class="font-semibold text-white">${title}</p>
                        <p class="text-sm text-gray-400 break-all">${safeMessage}</p>
                    </div>
                </div>`;
            ui.logs.insertAdjacentHTML('afterbegin', logHTML);
            lucide.createIcons();
        }

        function describeLevel(level) {
            switch (level) {
                case 'master': return '主密钥';
                case 'regional': return '区域密钥';
                case 'branch': return '分行密钥';
                default: return '未知层级';
            }
        }

        function getSecretByteLength(secret) {
            return textEncoder.encode(secret || '').length;
        }

        function ensureSecretWithinLimit(secret) {
            const limit = state.limits.maxSecretBytes;
            if (!limit) return;
            if (getSecretByteLength(secret) > limit) {
                throw new Error(`密钥长度超过限制（最多 ${limit} 字节，UTF-8 编码计算）。`);
            }
        }

        function getLimitNotice() {
            if (!state.limits.maxSecretBytes) return '';
            return `<p class="text-xs text-gray-500">提示：当前 Feldman 参数允许的明文最大长度约为 ${state.limits.maxSecretBytes} 字节。</p>`;
        }

        function createNode(name, type, id, extraClasses = '') {
            const node = document.createElement('div');
            node.className = `glassmorphism p-2 rounded-lg text-center shadow-lg border-2 border-gray-600 transition-all cursor-pointer ${extraClasses}`;
            node.dataset.type = type;
            node.dataset.id = id;
            node.title = name;
            node.innerHTML = `<p class="font-semibold">${name}</p>`;
            if (type === 'hq') node.style.width = '150px';
            if (type === 'branch') node.style.width = '90px';

            node.addEventListener('click', () => {
                if (!node.classList.contains('node-highlight')) return;
                const keyData = state.keys[state.currentKeyId];
                if (!keyData) return;
                const share = keyData.shares.find((s) => s.holder === id);
                if (!share) return;

                const isSelected = node.classList.toggle('node-selected');
                if (isSelected) {
                    const exists = state.selectedShares.some((s) => s.id === share.id && s.holder === share.holder);
                    if (!exists) {
                        state.selectedShares.push({ ...share });
                    }
                } else {
                    state.selectedShares = state.selectedShares.filter((s) => !(s.id === share.id && s.holder === share.holder));
                }
                updateRecoveryUI();
            });
            return node;
        }

        function renderOrgChart() {
            ui.orgChart.innerHTML = '';
            const org = state.organization || {};
            const hqNodes = Array.isArray(org?.hq?.nodes) ? org.hq.nodes : [];

            if (!hqNodes.length) {
                ui.orgChart.innerHTML = '<p class="text-gray-500 text-sm">请先初始化系统以生成组织结构图。</p>';
                return;
            }

            const hqTitle = document.createElement('p');
            hqTitle.className = 'text-sm text-gray-400';
            hqTitle.textContent = org.hq?.name || '全球总部';
            ui.orgChart.appendChild(hqTitle);

            const hqWrapper = document.createElement('div');
            hqWrapper.className = 'flex justify-center gap-4 flex-wrap mb-8';
            hqNodes.forEach((nodeInfo) => {
                const nodeEl = createNode(nodeInfo.name, 'hq', nodeInfo.id);
                hqWrapper.appendChild(nodeEl);
            });
            ui.orgChart.appendChild(hqWrapper);

            const regionsContainer = document.createElement('div');
            regionsContainer.className = 'flex justify-around flex-wrap gap-12 w-full';

            (org.regions || []).forEach((region) => {
                const regionSection = document.createElement('div');
                regionSection.className = 'flex flex-col items-center gap-4';

                const regionHeader = document.createElement('p');
                regionHeader.className = 'text-base font-semibold text-white';
                regionHeader.textContent = region.name;
                regionSection.appendChild(regionHeader);

                if (region.master_node) {
                    const masterRow = document.createElement('div');
                    masterRow.className = 'flex justify-center';
                    masterRow.appendChild(createNode(region.master_node.name, 'region', region.master_node.id));
                    regionSection.appendChild(masterRow);
                }

                const centers = region.regional_centers || region.centers || [];
                if (centers.length) {
                    const centerRow = document.createElement('div');
                    centerRow.className = 'flex justify-center gap-2 flex-wrap';
                    centers.forEach((center) => {
                        centerRow.appendChild(createNode(center.name, 'region', center.id));
                    });
                    regionSection.appendChild(centerRow);
                }

                const branches = region.branches || [];
                if (branches.length) {
                    const branchRow = document.createElement('div');
                    branchRow.className = 'flex justify-center gap-2 flex-wrap';
                    branches.forEach((branch) => {
                        branchRow.appendChild(createNode(branch.name, 'branch', branch.id, 'text-xs'));
                    });
                    regionSection.appendChild(branchRow);
                }

                regionsContainer.appendChild(regionSection);
            });

            ui.orgChart.appendChild(regionsContainer);
        }

        function updateRecoveryUI() {
            const keyData = state.keys[state.currentKeyId];
            if (!keyData || !keyData.threshold) {
                ui.recoveryHint.innerHTML = '请选择要恢复的密钥，并点击高亮节点收集份额。';
                ui.attemptRecovery.disabled = true;
                ui.attemptRecovery.classList.replace('bg-green-600', 'bg-gray-600');
                ui.attemptRecovery.classList.replace('hover:bg-green-700', 'hover:bg-gray-700');
                return;
            }

            const selectedCount = state.selectedShares.length;
            const threshold = Number(keyData.threshold) || 0;

            ui.recoveryHint.innerHTML = `请点击高亮节点收集份额。<br>当前已选择 <span class="font-bold text-white">${selectedCount}</span> / 需要 <span class="font-bold text-white">${threshold}</span> 份`;

            if (selectedCount >= threshold) {
                ui.attemptRecovery.disabled = false;
                ui.attemptRecovery.classList.replace('bg-gray-600', 'bg-green-600');
                ui.attemptRecovery.classList.replace('hover:bg-gray-700', 'hover:bg-green-700');
            } else {
                ui.attemptRecovery.disabled = true;
                ui.attemptRecovery.classList.replace('bg-green-600', 'bg-gray-600');
                ui.attemptRecovery.classList.replace('hover:bg-green-700', 'hover:bg-gray-700');
            }
        }

        async function showSharesModal(data) {
            const { key_id, polynomial } = data;
            const key = state.keys[key_id];
            if (!key) return;

            const thresholdInfo = key.threshold ? ` · 阈值 ${key.threshold}/${key.n}` : '';
            ui.modalTitle.textContent = `密钥详情 · ${describeLevel(key.level)}${thresholdInfo}`;

            if (polynomial && Array.isArray(polynomial) && polynomial.length) {
                ui.polynomialSection.classList.remove('hidden');
                const formatted = polynomial
                    .map((coeff, idx) => `a<sub>${idx}</sub> = ${String(coeff)}`)
                    .join('<br>');
                ui.modalPolynomial.innerHTML = formatted;
            } else {
                ui.polynomialSection.classList.add('hidden');
                ui.modalPolynomial.innerHTML = '';
            }

            ui.modalCommitments.innerHTML = (key.commitments || [])
                .map((c, idx) => `C<sub>${idx}</sub>: ${String(c)}`)
                .join('<br>');

            ui.modalShares.innerHTML = '';
            (key.shares || []).forEach((share) => {
                const friendlyName = share.label || share.holder;
                const card = document.createElement('div');
                card.className = 'glassmorphism p-3 rounded-lg border border-gray-600 text-sm';
                card.innerHTML = `
                    <p class="font-bold text-white">${friendlyName}</p>
                    <p class="text-xs text-gray-400">ID: ${share.id}</p>
                    <p class="text-xs text-gray-400 break-all">份额值: ${share.value}</p>
                    <button class="verify-btn text-xs py-1 px-2 bg-blue-600 hover:bg-blue-700 rounded w-full mt-2 btn">验证份额</button>
                    <div class="verification-details mt-2 text-xs bg-gray-900 p-2 rounded hidden break-all space-y-1"></div>
                `;
                ui.modalShares.appendChild(card);

                card.querySelector('.verify-btn').addEventListener('click', async (event) => {
                    const detailsDiv = card.querySelector('.verification-details');
                    const button = event.currentTarget;
                    if (!detailsDiv.classList.contains('hidden')) {
                        detailsDiv.classList.add('hidden');
                        button.textContent = '验证份额';
                        return;
                    }
                    button.disabled = true;
                    button.textContent = '验证中...';
                    try {
                        const res = await api.post('/get_verification_details', { key_id, share });
                        if (res.status === 'success') {
                            detailsDiv.innerHTML = `
                                <p class="${res.is_valid ? 'text-green-400' : 'text-red-400'} font-semibold">
                                    ${res.is_valid ? '✔ 验证通过' : '❌ 验证失败'}
                                </p>
                                <p class="text-gray-400 break-all"><span class="text-white">g<sup>s<sub>i</sub></sup></span> = ${res.lhs}</p>
                                <p class="text-gray-400 break-all"><span class="text-white">∏ C<sub>j</sub><sup>i^j</sup></span> = ${res.rhs}</p>
                            `;
                            log(res.is_valid ? 'success' : 'error', `份额验证 · ${friendlyName}`, res.is_valid ? '份额通过承诺验证。' : '份额未与承诺匹配。');
                        } else {
                            detailsDiv.innerHTML = `<p class="text-red-400">验证失败：${res.message}</p>`;
                            log('error', `份额验证 · ${friendlyName}`, res.message);
                        }
                        detailsDiv.classList.remove('hidden');
                        button.textContent = '隐藏结果';
                    } catch (err) {
                        log('error', `份额验证 · ${friendlyName}`, err.message);
                        button.textContent = '验证份额';
                    } finally {
                        button.disabled = false;
                    }
                });
            });

            ui.sharesModal.classList.remove('hidden');
        }

        function renderTabs(activeTab = 'master') {
            const regionOptions = state.organization.regions.length
                ? state.organization.regions.map((r) => `<option value="${r.value}">${r.name}</option>`).join('')
                : '<option value="" disabled>请先初始化系统</option>';

            const branchChoices = state.organization.all_branches.length
                ? state.organization.all_branches.map((b) => `
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" class="branch-checkbox bg-gray-700 border-gray-500" value="${b.id}">
                        <span>${b.name}</span>
                    </label>`).join('')
                : '<p class="text-xs text-gray-500">暂无分行数据，请先初始化系统。</p>';

            const limitNotice = getLimitNotice();

            const tabs = {
                master: {
                    title: '为银行总部与五大区域中心生成主密钥。恢复需要全部 3 个总部份额以及至少 3 个区域中心份额。',
                    content: `
                        <input type="text" id="masterSecret" class="w-full bg-gray-800 border border-gray-600 rounded-md px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入主密钥 (留空则随机)">
                        <button id="generateMaster" class="w-full mt-4 py-2 px-4 rounded-lg font-semibold bg-gray-600 hover:bg-gray-700 text-white btn">生成与分发主密钥</button>
                        ${limitNotice}
                    `,
                },
                regional: {
                    title: '为指定区域生成密钥。恢复需要该区域中心全部份额以及至少 60% 的分行份额。',
                    content: `
                        <select id="regionSelect" class="w-full bg-gray-800 border border-gray-600 rounded-md px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">${regionOptions}</select>
                        <input type="text" id="regionalSecret" class="w-full mt-4 bg-gray-800 border border-gray-600 rounded-md px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入区域密钥 (留空则随机)">
                        <button id="generateRegional" class="w-full mt-4 py-2 px-4 rounded-lg font-semibold bg-gray-600 hover:bg-gray-700 text-white btn">生成与分发区域密钥</button>
                        ${limitNotice}
                    `,
                },
                branch: {
                    title: '为跨分行协同任务生成临时密钥，恢复需要至少 3 个分行份额。',
                    content: `
                        <div id="branchSelectContainer" class="space-y-2 max-h-40 overflow-y-auto p-2 border border-gray-600 rounded-md">
                            ${branchChoices}
                        </div>
                        <input type="text" id="branchSecret" class="w-full mt-4 bg-gray-800 border border-gray-600 rounded-md px-3 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入分行密钥 (留空则随机)">
                        <button id="generateBranch" class="w-full mt-4 py-2 px-4 rounded-lg font-semibold bg-gray-600 hover:bg-gray-700 text-white btn">生成与分发分行密钥</button>
                        ${limitNotice}
                    `,
                },
            };

            ui.tabContent.innerHTML = `
                <div class="space-y-4">
                    <p class="text-sm text-gray-400">${tabs[activeTab].title}</p>
                    ${tabs[activeTab].content}
                </div>
            `;

            document.getElementById('generateMaster')?.addEventListener('click', generateKeyHandler);
            document.getElementById('generateRegional')?.addEventListener('click', generateKeyHandler);
            document.getElementById('generateBranch')?.addEventListener('click', generateKeyHandler);
        }

        async function generateKeyHandler(event) {
            const targetId = event.target.id;
            let payload = null;

            try {
                if (targetId === 'generateMaster') {
                    const secret = document.getElementById('masterSecret').value || `MasterKey_${Date.now()}`;
                    ensureSecretWithinLimit(secret);
                    payload = { level: 'master', secret };
                } else if (targetId === 'generateRegional') {
                    const region = document.getElementById('regionSelect').value;
                    if (!region) throw new Error('请先选择区域。');
                    const secret = document.getElementById('regionalSecret').value || `RegionalKey_${region}_${Date.now()}`;
                    ensureSecretWithinLimit(secret);
                    payload = { level: 'regional', secret, region };
                } else if (targetId === 'generateBranch') {
                    const branches = Array.from(document.querySelectorAll('.branch-checkbox:checked')).map((cb) => cb.value);
                    if (branches.length < 3) {
                        throw new Error('请至少选择 3 个分行。');
                    }
                    const secret = document.getElementById('branchSecret').value || `BranchKey_${Date.now()}`;
                    ensureSecretWithinLimit(secret);
                    payload = { level: 'branch', secret, branches };
                }

                if (!payload) return;

                const res = await api.post('/create_key', payload);
                if (res.status !== 'success') {
                    log('error', `生成 ${payload.level} 密钥失败`, res.message);
                    return;
                }

                const keyInfo = res.key_info;
                const keyLabel = (() => {
                    switch (keyInfo.level) {
                        case 'master': return '主密钥';
                        case 'regional': {
                            const regionEntry = state.organization.regions.find((r) => r.value === keyInfo.region);
                            return `区域密钥 · ${(regionEntry?.name || keyInfo.region)}`;
                        }
                        case 'branch': {
                            const shareCount = keyInfo.shares?.length || payload.branches?.length || 0;
                            return `分行密钥 · ${shareCount} 份`;
                        }
                        default: return '密钥';
                    }
                })();

                state.keys[res.key_id] = { ...keyInfo, description: keyLabel };

                log('action', `生成 ${keyLabel}`, 'Python 后端已成功创建并分发份额。');

                const optionText = `${keyLabel} @ ${new Date().toLocaleTimeString()}`;
                ui.recoveryLevelSelect.add(new Option(optionText, res.key_id, false, true));
                ui.recoveryLevelSelect.value = res.key_id;
                ui.recoveryLevelSelect.dispatchEvent(new Event('change'));

                await showSharesModal(res);
            } catch (error) {
                log('error', '操作失败', error.message);
            }
        }

        ui.initSystem.addEventListener('click', async () => {
            if (state.systemInitialized) return;
            try {
                const data = await api.post('/initialize', {});
                if (data.status !== 'success') {
                    log('error', '初始化失败', data.message);
                    return;
                }

                state.systemInitialized = true;
                state.organization = data.organization_structure || state.organization;
                const limitRaw = data.limits?.max_secret_bytes;
                const limit = typeof limitRaw === 'number' ? limitRaw : parseInt(limitRaw, 10);
                state.limits.maxSecretBytes = Number.isFinite(limit) ? limit : null;

                ui.initSystem.textContent = '系统已初始化';
                ui.initSystem.disabled = true;
                ui.initSystem.classList.replace('bg-blue-600', 'bg-green-600');

                ui.paramP.textContent = String(data.vss_params.p);
                ui.paramQ.textContent = String(data.vss_params.q);
                ui.paramG.textContent = String(data.vss_params.g);

                ui.vssParams.classList.remove('hidden');
                ui.keyOps.classList.remove('hidden');
                ui.recoveryRefreshOps.classList.remove('hidden');

                renderOrgChart();
                renderTabs();

                const hint = state.limits.maxSecretBytes
                    ? `最大明文长度约为 ${state.limits.maxSecretBytes} 字节。`
                    : '最大明文长度取决于 Feldman 参数。';
                log('success', '系统初始化成功', `后端已完成参数生成。${hint}`);
            } catch (error) {
                log('error', '连接后端失败', `无法连接到 Python 后端服务。错误: ${error.message}`);
            }
        });

        ui.attemptRecovery.addEventListener('click', async () => {
            if (!state.currentKeyId) return;
            const shares = state.selectedShares.map((share) => ({ ...share }));
            try {
                const res = await api.post('/recover_secret', { key_id: state.currentKeyId, shares });
                if (res.status === 'success') {
                    log('success', '密钥恢复成功', `后端使用拉格朗日插值成功恢复密钥: "${res.recovered_secret}"`);
                } else {
                    log('error', '密钥恢复失败', res.message);
                }
            } catch (error) {
                log('error', '操作失败', error.message);
            }
        });

        ui.refreshShares.addEventListener('click', async () => {
            if (!state.currentKeyId) return;
            try {
                const res = await api.post('/refresh_shares', { key_id: state.currentKeyId });
                if (res.status === 'success') {
                    const previous = state.keys[state.currentKeyId] || {};
                    state.keys[state.currentKeyId] = { ...res.new_key_info, description: previous.description };
                    log('success', '份额刷新成功', '后端已刷新所有份额，旧份额立即失效。');

                    await showSharesModal({ key_id: state.currentKeyId, polynomial: null });
                    ui.recoveryLevelSelect.dispatchEvent(new Event('change'));
                } else {
                    log('error', '份额刷新失败', res.message);
                }
            } catch (error) {
                log('error', '操作失败', error.message);
            }
        });

        ui.keyTabs.addEventListener('click', (event) => {
            const tab = event.target.closest('.tab-btn');
            if (!tab) return;
            ui.keyTabs.querySelector('.active')?.classList.remove('active');
            tab.classList.add('active');
            renderTabs(tab.dataset.tab);
        });

        ui.closeModal.addEventListener('click', () => ui.sharesModal.classList.add('hidden'));
        ui.clearLogs.addEventListener('click', () => ui.logs.innerHTML = '');

        ui.recoveryLevelSelect.addEventListener('change', () => {
            document.querySelectorAll('.node-highlight, .node-selected').forEach((el) => {
                el.classList.remove('node-highlight', 'node-selected');
            });

            state.currentKeyId = ui.recoveryLevelSelect.value;
            state.selectedShares = [];

            if (!state.currentKeyId) {
                ui.refreshShares.disabled = true;
                updateRecoveryUI();
                return;
            }

            const keyData = state.keys[state.currentKeyId];
            if (!keyData) {
                log('error', '未知的密钥 ID', state.currentKeyId);
                ui.refreshShares.disabled = true;
                updateRecoveryUI();
                return;
            }

            ui.refreshShares.disabled = false;
            (keyData.shares || []).forEach((share) => {
                const node = document.querySelector(`[data-id="${share.holder}"]`);
                if (node) node.classList.add('node-highlight');
            });
            updateRecoveryUI();
        });

        renderOrgChart();
        renderTabs();
    });
} catch (error) {
    console.error('Demo 初始化失败:', error);
    document.body.innerHTML = `<div class="text-red-500 p-8">抱歉，Demo 加载失败。错误: ${error.message}</div>`;
}
</script>
</body>
</html>
